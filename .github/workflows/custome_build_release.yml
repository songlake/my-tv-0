name: Build JellyBean Release APK

on:
  push:
    branches:
      - jellybean
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. 编译无签名的 Release APK
      - name: Build Release Unsigned APK
        run: ./gradlew assembleRelease --stacktrace

      # 2. 原生构建工具对齐 (zipalign) 与 V1 签名 (apksigner)
      - name: Align and Sign APK for Android 4.2.2
        run: |
          # 找到 Gradle 生成的原始 release apk
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" -o -name "*.apk" | head -n 1)
          echo "Found Unsigned APK: $UNSIGNED_APK"
          
          # 使用最新 Android Build-Tools 的路径
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/34.0.0"
          
          # 生成临时签名 Key
          keytool -genkey -v -keystore release.keystore -storepass android -alias androidkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,OU=Android,O=Android,L=Android,ST=Android,C=US"
          
          # 步骤 A: 4 字节内存对齐 (Zipalign)
          $BUILD_TOOLS_PATH/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          
          # 步骤 B: 强行启用 V1 签名（兼容 Android 4.2.2）
          $BUILD_TOOLS_PATH/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --out my-tv-jellybean-final.apk aligned.apk
          
          # 检查签名是否包含 V1
          $BUILD_TOOLS_PATH/apksigner verify -v my-tv-jellybean-final.apk

      # 3. 仅上传最终完美签名的 APK
      - name: Upload Final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-jellybean-release
          path: my-tv-jellybean-final.apk
