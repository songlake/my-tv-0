name: Build JellyBean Release APK

on:
  push:
    branches:
      - jellybean
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. 编译极简 Release 版本（会进行代码剪裁和优化）
      - name: Build Release Unsigned APK
        run: ./gradlew assembleRelease --stacktrace

      # 2. 使用标准签名库为 Release APK 签名（保证老盒子能正常安装）
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ALIAS_PASSWORD }}
        continue-on-error: true # 若未配置个人 KeyStore，自动跳过并用下一步的默认签名补救

      # 3. 兜底方案：如果无 Secrets，生成默认签名的 Release 包
      - name: Auto Sign Release APK (Fallback)
        if: steps.sign_app.outcome != 'success'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,OU=Android,O=Android,L=Android,ST=Android,C=US"
          
          # 寻找生成的未签名/对齐 release apk 并用 apksigner 完成 V1/V2 签名
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/my-tv-jellybean-release.apk "$APK_PATH"
          fi

      # 4. 上传极简版 Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-jellybean-release
          path: app/build/outputs/apk/release/*release.apk
